
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Management System</title>
</head>
<body>
<h1>Employee Management System</h1>

<p th:if="${success}" th:text="${success}"
   style="color:green"></p>

<h2>Add Employee</h2>

<form th:action="@{/employees}" th:object="${employee}"
      method="post">

    <label>Full Name</label>
    <input type="text" th:field="*{fullName}">
    <span th:errors="*{fullName}" style="color:red"></span>
    <br><br>

    <label>Email</label>
    <input type="email" th:field="*{email}">
    <span th:errors="*{email}" style="color:red"></span>
    <br><br>

    <label>Phone</label>
    <input type="text" th:field="*{phone}">
    <span th:errors="*{phone}" style="color:red"></span>
    <br><br>

    <label>Department</label>
    <input type="text" th:field="*{department}">
    <span th:errors="*{department}" style="color:red"></span>
    <br><br>

    <label>Salary</label>
    <input type="number" step="0.01" min="0"
           th:field="*{salary}">
    <span th:errors="*{salary}" style="color:red"></span>
    <br><br>

    <button type="submit">Save Employee</button>
</form>

<hr>

<h2>Employee List</h2>

<form th:action="@{/employees}" method="get">
    <input type="text" name="keyword"
           placeholder="Search by employee name"
           th:value="${keyword}">
    <button type="submit">Search</button>
    <a th:href="@{/employees}">Clear</a>
</form>

<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>ID</th>
        <th>Full Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Department</th>
        <th>Salary</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="emp : ${employees}">
        <td th:text="${emp.id}"></td>
        <td th:text="${emp.fullName}"></td>
        <td th:text="${emp.email}"></td>
        <td th:text="${emp.phone}"></td>
        <td th:text="${emp.department}"></td>
        <td th:text="${emp.salary}"></td>
        <td>
            <a th:href="@{/employees/{id}/edit(id=${emp.id})}">
                Edit
            </a>

            <form th:action="@{/employees/{id}/delete(id=${emp.id})}"
                  method="post" style="display:inline"
                  onsubmit="return confirm('Delete this employee?');">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>

    <tr th:if="${#lists.isEmpty(employees)}">
        <td colspan="7">No employees found.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
