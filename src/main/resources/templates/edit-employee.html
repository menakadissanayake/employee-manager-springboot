
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Employee</title>
</head>
<body>

<h1>Edit Employee</h1>

<form th:action="@{/employees/{id}/update(id=${employee.id})}"
      th:object="${employee}" method="post">

    <label>Full Name</label>
    <input type="text" th:field="*{fullName}">
    <span th:errors="*{fullName}" style="color:red"></span>
    <br><br>

    <label>Email</label>
    <input type="email" th:field="*{email}">
    <span th:errors="*{email}" style="color:red"></span>
    <br><br>

    <label>Phone</label>
    <input type="text" th:field="*{phone}">
    <span th:errors="*{phone}" style="color:red"></span>
    <br><br>

    <label>Department</label>
    <input type="text" th:field="*{department}">
    <span th:errors="*{department}" style="color:red"></span>
    <br><br>

    <label>Salary</label>
    <input type="number" step="0.01" min="0"
           th:field="*{salary}">
    <span th:errors="*{salary}" style="color:red"></span>
    <br><br>

    <button type="submit">Update Employee</button>
    <a th:href="@{/employees}">Cancel</a>
</form>

</body>
</html>
